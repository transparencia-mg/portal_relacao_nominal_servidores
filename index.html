<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Relação Nominal de Servidores - Governo de Minas Gerais</title>

    <!-- ============================================================
         BIBLIOTECAS EXTERNAS
    ============================================================ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

    <!-- Chart.js | PapaParse | jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        /* ============================================================
           1. VARIÁVEIS DE CORES
        ============================================================ */
        :root {
            --primary-dark:      #1a3a5c;
            --primary-darker:    #0f2a44;
            --accent-red:        #b93c42;
            --accent-bright:     #db233f;
            --background-light:  #f5f7fa;
            --success-green:     #28a745;
            --warning-yellow:    #ffc107;
            --info-blue:         #17a2b8;
        }

        /* ============================================================
           2. RESET E CONFIGURAÇÕES GLOBAIS
        ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; overflow-x: hidden; margin: 0; padding: 0; height: auto; min-height: auto; }
        body {
            font-family: 'Montserrat', Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-light);
            padding-bottom: 15px;
            overflow-x: hidden;
            min-height: auto;
            height: auto;
            position: relative;
        }
        body, button, input, select, textarea, span, div { font-family: 'Montserrat', sans-serif !important; }
        .material-icons { font-family: 'Material Icons' !important; font-size: 14px; vertical-align: middle; }

        /* ============================================================
           3. LAYOUT PRINCIPAL
        ============================================================ */
        .main-container { height: auto; min-height: auto; overflow: visible; position: relative; }
        .container-fluid { width: 100%; max-width: 88% !important; padding: 0 40px; margin: 0; height: auto; min-height: auto; }
        .container { max-width: 85% !important; }
        .dashboard-container { width: 100%; max-width: 100%; padding: 0 40px; margin: 0 auto; height: auto; min-height: auto; }
        .tab-content, .tab-pane { width: 100%; height: auto; min-height: auto; overflow: visible; }
        .table-container { height: auto; min-height: auto; overflow: visible; position: relative; }
        .iframe-mode { overflow: visible !important; }

        /* ============================================================
           4. DATA DE ATUALIZAÇÃO
        ============================================================ */
        .data-atualizacao-container { display: flex; justify-content: left; align-items: center; margin: 15px 0; }
        .data-atualizacao-box {
            background: transparent !important;
            border-radius: 8px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--primary-dark);
            font-weight: 600;
            box-shadow: none;
        }
        .data-atualizacao-box i { font-size: 14px; color: var(--accent-red); }

        /* ============================================================
           5. FILTROS
        ============================================================ */
        .filter-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 20px;
            border-left: none;
            width: 100%;
        }
        .filter-label { font-size: 13px; font-weight: 600; color: #1a3a5c; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .filter-label i { font-size: 14px; color: var(--accent-red); }
        .form-control, .form-select {
            border: 2px solid #e9ecef;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 13px;
            transition: all 0.3s ease;
            height: auto;
            width: 100%;
        }
        .form-control:focus, .form-select:focus { border-color: var(--accent-red); box-shadow: 0 0 0 2px rgba(185,60,66,0.15); }
        .modern-select {
            border: 1.5px solid #dfe5ec !important;
            border-radius: 8px !important;
            padding: 10px 12px !important;
            font-size: 14px !important;
            height: 48px !important;
            line-height: 1.5 !important;
            background-color: #fff;
            transition: all 0.2s ease;
            width: 100%;
        }
        .modern-select:focus { border-color: #1a3a5c !important; box-shadow: 0 0 0 2px rgba(26,58,92,0.1); }
        .filters-row { display: flex; gap: 15px; width: 100%; flex-wrap: wrap; }
        .filters-row .filter-group { width: auto !important; }
        .filter-group { flex: 1; min-width: 120px; }
        .filter-buttons-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-left: auto; }
        .consulta-filters-row { display: flex; flex-wrap: wrap; gap: 15px; width: 100%; }
        .consulta-filter-group { flex: 1 1 calc(33.333% - 15px); min-width: 200px; }
        .consulta-buttons-row { display: flex; gap: 10px; width: 100%; margin-top: 15px; justify-content: flex-start; flex-wrap: wrap; }
        .botoes-abaixo { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }

        /* ============================================================
           6. CARDS DE MÉTRICAS
        ============================================================ */
        .metric-card {
            background: white;
            border-radius: 8px;
            border: 1px solid #e5e9ef;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            overflow: hidden;
            height: 100%;
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }
        .metric-card:hover { box-shadow: 0 8px 24px rgba(26,58,92,0.13); transform: translateY(-2px); }
        .metric-header {
            background: #20445d;
            color: white;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metric-header.green  { background: #20445d; }
        .metric-header.amber  { background: #20445d; }
        .metric-header.red    { background: #20445d; }
        .metric-body { padding: 12px 15px; }
        .metric-value { font-size: 20px; font-weight: 700; color: #171c21; }
        .metric-sublabel { font-size: 10px; color: #94a3b8; font-weight: 500; margin-top: 2px; }

        /* ============================================================
           7. GRÁFICOS
        ============================================================ */
        .chart-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            min-height: 320px;
            padding: 0;
            overflow: hidden;
        }
        .chart-container canvas { max-width: 100%; }
        .chart-header { background: #20445d; color: white; padding: 12px 16px; margin: 0; }
        .chart-title { font-size: 14px; font-weight: 600; color: white; margin: 0; }
        .chart-wrapper { height: 300px; display: flex; align-items: center; justify-content: center; padding: 10px 15px; width: 100%; }
        .chart-container.chart-pizza-container {
            min-height: auto;
        }
        .chart-wrapper.chart-pizza { height: auto; display: flex; align-items: center; justify-content: center; padding: 10px 20px 0 20px; }
        .chart-pizza-layout { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; gap: 10px; padding: 10px 20px; }
        .chart-pizza-box { width: 200px; height: 200px; flex-shrink: 0; }
        .legend-grid { display: grid; grid-template-columns: 1fr 1fr; justify-content: center; align-items: flex-start; gap: 6px 20px; font-size: 8px; width: 100%; padding: 4px 10px 10px; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

        /* ============================================================
           8. TABELAS
        ============================================================ */
        .table-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-darker) 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-title { font-size: 13px; font-weight: 600; margin: 0; }
        .table-badge { background: #1a3a5c; color: white; padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .table-fixed-header-container { position: relative; overflow: auto; width: 100%; max-height: 600px; }
        .table-fixed-header-container table thead th {
            background-color: #54697b !important;
            color: white !important;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
            padding: 12px 10px;
            font-size: 12px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .table { width: 100%; font-size: 13px; border-collapse: collapse; table-layout: auto; }
        .table th, .table td { border: 1px solid #d6dee6; }
        .table thead th {
            background-color: #54697b !important;
            color: white !important;
            font-weight: 600;
            font-size: 12px;
            padding: 12px 10px;
            text-transform: uppercase;
            border: 1px solid #d6dee6;
            cursor: pointer;
            user-select: none;
        }
        .table thead th:first-child { border-top-left-radius: 8px; }
        .table thead th:last-child  { border-top-right-radius: 8px; }
        .table thead th:hover { background-color: #3d5566 !important; }
        .table thead th.asc::after  { content: ' ↑'; font-size: 11px; }
        .table thead th.desc::after { content: ' ↓'; font-size: 11px; }
        .sortable-header { cursor: pointer; position: relative; padding-right: 22px !important; }
        .sortable-header:hover { background-color: #3d5566 !important; }
        .sortable-header i { font-size: 13px; position: absolute; right: 5px; top: 50%; transform: translateY(-50%); opacity: 0.8; }
        .table tbody tr { background-color: #ffffff; }
        .table tbody td { padding: 10px 10px; vertical-align: middle; border-bottom: 1px solid #f1f1f1; font-size: 12px; }
        .table tbody tr:nth-child(even) { background-color: #ffffff; }
        .table tbody tr:hover { background-color: rgba(41,67,90,0.04); }
        .table tfoot { position: sticky; bottom: 0; z-index: 20; }
        .table tfoot tr, .table tfoot td { background-color: #dfe3e8 !important; font-weight: 700; font-size: 12px; }
        .table-bordered { border: 1px solid #dee2e6; width: 100%; }
        .table-bordered th, .table-bordered td { border: 1px solid #dee2e6; padding: 12px; vertical-align: top; }
        .table-responsive { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .orgao-link { color: #006a82; text-decoration: none; font-weight: 400; cursor: pointer; }
        .orgao-link:hover { color: var(--accent-red); text-decoration: underline; }
        .nome-link { color: #006a82 !important; text-decoration: none !important; font-weight: 400; }
        .nome-link:hover { color: #b93c42 !important; text-decoration: underline !important; }

        /* ============================================================
           9. BOTÕES
        ============================================================ */
        .btn-pesquisa {
            background: linear-gradient(to right, #20445d, #20445d);
            border: none;
            padding: 0 16px;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 13px;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            height: 36px;
            white-space: nowrap;
        }
        .btn-pesquisa:hover { background: linear-gradient(to right, var(--accent-red), #a32c32); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(185,60,66,0.2); color: white; }
        .btn-secondary-custom {
            background: white;
            border: 2px solid var(--primary-darker);
            color: var(--primary-darker);
            padding: 0 16px;
            font-weight: 600;
            font-size: 13px;
            border-radius: 6px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            height: 36px;
            white-space: nowrap;
            text-decoration: none !important;
        }
        .btn-secondary-custom:hover { background-color: #132837 !important; color: white !important; border-color: #132837 !important; }
        .btn-export {
            appearance: none;
            -webkit-appearance: none;
            background: transparent !important;
            border: 1px solid #d6dee6;
            color: #1a3a5c;
            padding: 0 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-export i { font-size: 14px !important; }
        button.btn-export:hover, a.btn-export:hover { background-color: #1a3a5c !important; border-color: #1a3a5c !important; color: #ffffff !important; }
        .btn-action {
            padding: 4px;
            border-radius: 7px;
            border: 1.5px solid #1a3a5c;
            background-color: #ffffff;
            color: #1a3a5c;
            width: 32px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-action:hover { background-color: #1a3a5c; color: #ffffff; }

        /* Botão "Voltar ao topo" */
        .btn-topo {
            background: #eeeff5;
            color: #1a3a5c;
            border: 1px solid #d6dee6;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            height: 32px;
        }
        .btn-topo:hover { background-color: #1a3a5c; color: #ffffff; border-color: #1a3a5c; }

        /* ============================================================
           10. NAVEGAÇÃO (abas)
        ============================================================ */
        .nav-tabs-container { background: transparent; padding: 10px 0; margin-top: 15px; margin-bottom: 15px; width: 100%; }
        .nav-tabs { border: none !important; gap: 10px; width: 100%; flex-wrap: wrap; }
        .nav-tabs .nav-link {
            border: none !important;
            background: #ffffff !important;
            border-radius: 10px !important;
            padding: 8px 18px !important;
            font-weight: 500;
            font-size: 14px;
            color: #1a3a5c !important;
            display: inline-flex !important;
            align-items: center;
            gap: 6px;
            transition: all .25s ease;
        }
        .nav-tabs .nav-link:hover { background: #e6e9ed !important; }
        .nav-tabs .nav-link.active { background: #234c63 !important; color: #fff !important; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .nav-tabs .material-icons { font-size: 14px !important; }

        /* ============================================================
           11. MODAL
        ============================================================ */
        .modal-full-custom { max-width: 82% !important; width: 82% !important; }
        .modal-creative .modal-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-darker) 100%);
            color: white !important;
            padding: 15px 20px;
            border-bottom: none;
        }
        .modal-creative .modal-header .modal-title { color: white !important; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .modal-creative .modal-header .btn-close { filter: brightness(0) invert(1); opacity: 1; }
        .modal-creative .modal-header .btn-close:hover { opacity: 0.8; }
        .modal-server-banner {
            background: linear-gradient(135deg, #20445d 0%, #162f42 100%);
            color: white;
            padding: 13px 18px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .modal-server-banner .server-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
        .modal-server-banner .server-meta { font-size: 11px; opacity: 0.85; margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .modal-nav-tabs { border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; }
        .modal-nav-tabs .nav-link {
            font-size: 12px; padding: 7px 16px; color: #64748b; border: none;
            border-bottom: 3px solid transparent; border-radius: 0; display: inline-flex;
            align-items: center; gap: 5px; font-weight: 600; transition: color .2s; background: none !important;
        }
        .modal-nav-tabs .nav-link.active { color: #20445d; border-bottom-color: #20445d; }
        .info-section { background: #f8fafd; border-radius: 10px; padding: 13px 16px; margin-bottom: 13px; border: 1px solid #e2e8f0; }
        .info-section h6 { font-weight: 700; color: #1a3a5c; margin-bottom: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
        .info-row { display: flex; padding: 5px 0; border-bottom: 1px solid #f0f4f8; }
        .info-row:last-child { border-bottom: none; }
        .info-label-modal { width: 42%; font-weight: 600; color: #64748b; font-size: 11px; }
        .info-value-modal { width: 58%; color: #1e293b; font-size: 11px; font-weight: 500; word-break: break-word; }

        /* ============================================================
           12. PAGINAÇÃO
        ============================================================ */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 20px;
            background: white;
            border-top: 1px solid #dee2e6;
            width: 100%;
            gap: 12px;
            flex-wrap: wrap;
        }
        .pagination-info { font-size: 12px; color: #6c757d; }
        .pagination .page-link { color: var(--primary-dark); border-color: #dee2e6; font-size: 13px; padding: 4px 10px; }
        .pagination .page-link:hover { color: var(--accent-red); background-color: #f8f9fa; }
        .pagination .page-item.active .page-link { background-color: var(--primary-dark); border-color: var(--primary-dark); color: white; }
        .items-per-page {
            height: 34px;
            min-width: 80px;
            border-radius: 8px;
            border: 1px solid #d6dee6;
            padding: 4px 28px 4px 10px;
            font-size: 13px;
            font-weight: 600;
            color: #1a3a5c;
            background-color: #ffffff;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%231a3a5c' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 6px center;
        }

        /* ============================================================
           13. BUSCA NA TABELA
        ============================================================ */
        .table-search-container {
            display: flex;
            align-items: center;
            white-space: nowrap;
            background: #ffffff;
            border: 1px solid #d6dee6;
            border-radius: 8px;
            padding: 5px 10px;
            height: 34px;
        }
        .table-search-container:hover { border-color: #1a3a5c; }
        .table-search-input { border: none !important; outline: none; background: transparent; font-size: 12px; width: 180px; color: #1a3a5c; }
        .table-search-input::placeholder { color: #94a3b8; }

        /* ============================================================
           14. BADGES DE SITUAÇÃO
        ============================================================ */
        .badge-sit { padding: 3px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 700; display: inline-block; letter-spacing: 0.2px; }
        .badge-efetivo   { background: #dcf5e7; color: #0f6b3a; border: 1px solid #b2e6c8; }
        .badge-aposentado { background: #fff8e1; color: #7a5b00; border: 1px solid #ffe082; }
        .badge-desligado { background: #fde8ea; color: #8b1a22; border: 1px solid #f5b8bc; }
        .badge-outro     { background: #f0f2f5; color: #4a5568; border: 1px solid #dce3ec; }

        /* ============================================================
           15. TOOLBAR
        ============================================================ */
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .toolbar-left  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        /* ============================================================
           16. LOADING
        ============================================================ */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(238,241,246,0.95);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 14px;
        }
        .loading-progress { font-size: 13px; color: #20445d; font-weight: 700; }

        /* ============================================================
           17. TOAST
        ============================================================ */
        .toast-sucesso {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #e6f4ea;
            color: #1e4620;
            border-radius: 12px;
            padding: 14px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 9999;
            min-width: 280px;
        }
        .toast-content { display: flex; align-items: center; justify-content: center; width: 100%; text-align: center; gap: 10px; }
        .toast-content i { color: #28a745; font-size: 14px; }
        .toast-close { cursor: pointer; font-size: 14px; margin-left: 10px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ============================================================
           18. HISTÓRICO — destaque de alteração
        ============================================================ */
        .hist-legend { font-size: 11px; color: #555; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

        /* ============================================================
           19. COLUMN SELECTOR
        ============================================================ */
        .column-selector-popup {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid #dce4ee;
            border-radius: 10px;

<script>

// ============================================================
// 1. CONFIGURAÇÃO E CONSTANTES
// ============================================================
const BASE_URL  = 'https://raw.githubusercontent.com/transparencia-mg/portal_relacao_nominal_servidores/refs/heads/main/dataset/data/';
const GITHUB_API = 'https://api.github.com/repos/transparencia-mg/portal_relacao_nominal_servidores/contents/dataset/data';

// MES BASE (jan/2022 — snapshot inicial completo)
const MES_BASE = '202201';

// Mês mais atual — será detectado automaticamente via GitHub API
let MES_MAIS_ATUAL = '202602';

const chartPalette = ['#2f4b63','#39a585','#5f6f7f','#f28c28','#7aa6c2','#8e44ad','#c0392b','#16a085','#d35400','#2980b9'];

function getFileUrls(anoMes) {
    const urls = [];
    if (anoMes === '202201') {
        for (let i = 1; i <= 9; i++) urls.push(BASE_URL + `dados_serv_202201_${i}.csv`);
    } else {
        urls.push(BASE_URL + `dados_serv_${anoMes}.csv`);
    }
    return urls;
}

function getMesesDisponiveis() {
    const meses = [];
    for (let m = 1; m <= 12; m++) meses.push('2022' + String(m).padStart(2,'0'));
    for (let m = 1; m <= 12; m++) meses.push('2023' + String(m).padStart(2,'0'));
    for (let m = 1; m <= 12; m++) meses.push('2024' + String(m).padStart(2,'0'));
    for (let m = 1; m <= 12; m++) meses.push('2025' + String(m).padStart(2,'0'));
    // 2026: até o mês mais atual
    const anoAtual = parseInt(MES_MAIS_ATUAL.slice(0,4));
    const mesAtual = parseInt(MES_MAIS_ATUAL.slice(4,6));
    if (anoAtual >= 2026) {
        for (let m = 1; m <= mesAtual; m++) meses.push('2026' + String(m).padStart(2,'0'));
    }
    return meses;
}

// ============================================================
// 2. ESTADO GLOBAL
// ============================================================
const cacheRows = new Map();
let todosServidores = new Map();
let servidoresFiltrados = [];
let orgaoSelecionado = '';
let anoMesAtivo = MES_MAIS_ATUAL;

let filtroVisao   = { ano: '2026', mes: '02', orgao: '' };
let filtroConsulta = { masp: '', nome: '', nmefetivo: '', instDotacao: '', instLotacao: '', situacao: '' };
let filtroConsultaAnoMes = { ano: '2026', mes: '02' };

let paginaVisao = 1, itensPorPaginaVisao = 25;
let paginaConsulta = 1, itensPorPaginaConsulta = 50;
let buscaConsulta = '';

let ordenacaoVisao    = { col: 'orgao', dir: 'asc' };
let ordenacaoConsulta = { col: 'nome',  dir: 'asc' };

let colunasConsulta = {
    masp: true, adm: true, nome: true, siglaefetivo: true, nmefetivo: true,
    cdcomi: false, desccomi: true, cd_funcao_gratif_gte: false, desc_funcao_gratif_gte: true,
    carga_horaria: true, cd_instituicao_dotacao: false, sigla_instituicao_dotacao: true,
    desc_instituicao_dotacao: false, cd_instituicao_lotacao: false, sigla_instituicao_lotacao: true,
    desc_instituicao_lotacao: false, descsitserv: true,
    id_data_inicio: true, id_data_aposentadoria: true, id_data_desligamento: true
};
const colunasFix = new Set(['masp','adm','id_data_inicio','id_data_aposentadoria','id_data_desligamento']);

let chartSituacao = null, chartOrgaoVis = null;

// Modal export helpers
let _modalServidor = null;
let _modalHistoricoData = null;

// ============================================================
// 3. AUXILIARES
// ============================================================
function mostrarLoading(show, msg) {
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    if (msg) document.getElementById('loadingProgress').textContent = msg;
}

function nomeMes(m) {
    const nomes = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    return nomes[parseInt(m)] || m;
}

function formatarData(val) {
    if (!val) return '-';
    const s = String(val).trim();
    if (s.length >= 10) {
        const parts = s.substring(0,10).split('-');
        if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }
    return s;
}

function badgeSit(sit) {
    if (!sit) return '<span class="badge-sit badge-outro">-</span>';
    const s = sit.toUpperCase();
    if (s.includes('EFETIVO'))                                              return `<span class="badge-sit badge-efetivo">${sit}</span>`;
    if (s.includes('APOSENTADO'))                                           return `<span class="badge-sit badge-aposentado">${sit}</span>`;
    if (s.includes('DESLIGADO')||s.includes('EXONERADO')||s.includes('FALECIDO')) return `<span class="badge-sit badge-desligado">${sit}</span>`;
    return `<span class="badge-sit badge-outro">${sit}</span>`;
}

function v(val) { return val || '-'; }
function escapar(s) { return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function iframeUpdateHeight() {
    try {
        const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) + 10;
        if (window.parent && window.parent !== window) {

}

function mostrarToast() {

// ============================================================
// 4. DATA DE ATUALIZAÇÃO — arquivo mais recente da pasta /data
// ============================================================
async function setupAtualizacaoData() {
    const el = document.getElementById('data-atualizacao-header');
    try {
        const resp = await fetch(GITHUB_API);
        if (!resp.ok) throw new Error('erro api');
        const arquivos = await resp.json();

        const csvFiles = arquivos
            .filter(f => f.name && f.name.match(/^dados_serv_\d{6}\.csv$/))
            .sort((a, b) => b.name.localeCompare(a.name));

        if (csvFiles.length > 0) {
            const arqMaisRecente = csvFiles[0].name;
            const matchMes = arqMaisRecente.match(/dados_serv_(\d{6})\.csv/);
            if (matchMes) {
                MES_MAIS_ATUAL       = matchMes[1];
                anoMesAtivo          = MES_MAIS_ATUAL;
                filtroVisao          = { ano: MES_MAIS_ATUAL.slice(0,4), mes: MES_MAIS_ATUAL.slice(4,6), orgao: '' };
                filtroConsultaAnoMes = { ...filtroVisao };
            }

            // Busca data do commit em paralelo, sem bloquear o carregamento dos dados
            fetch(`https://api.github.com/repos/transparencia-mg/portal_relacao_nominal_servidores/commits?path=dataset/data/${arqMaisRecente}&per_page=1`)
                .then(r => r.ok ? r.json() : null)
                .then(commits => {
                    if (commits && commits.length > 0)
                        el.textContent = ' ' + new Date(commits[0].commit.committer.date).toLocaleDateString('pt-BR');
                    else
                        el.textContent = ' ' + arqMaisRecente.replace('dados_serv_','').replace('.csv','');
                })
                .catch(() => { el.textContent = ' ' + arqMaisRecente.replace('dados_serv_','').replace('.csv',''); });
        } else {
            el.textContent = ' Não disponível';
        }
    } catch(e) {
        el.textContent = ' Não disponível';
    }
}

// ============================================================
// 5. CARREGAMENTO DE DADOS
// ============================================================
async function fetchCSV(url) {
    try {
        const resp = await fetch(url);
        if (!resp.ok) return [];
        const text = await resp.text();
        return new Promise(resolve => {
            Papa.parse(text, { header: true, delimiter: ';', skipEmptyLines: true,
                complete: r => resolve(r.data) });
        });
    } catch(e) { return []; }
}

async function garantirMes(anoMes) {
    if (cacheRows.has(anoMes)) return;
    const urls = getFileUrls(anoMes);
    const partes = await Promise.all(urls.map(url => fetchCSV(url)));
    cacheRows.set(anoMes, partes.flat());
}

async function garantirMeses(listaAnoMes) {
    const faltando = listaAnoMes.filter(am => !cacheRows.has(am));
    if (faltando.length === 0) return;
    await Promise.all(faltando.map(am => garantirMes(am)));
}

// ============================================================
// CARREGAMENTO A PARTIR DO JSON CONSOLIDADO
// ============================================================

// Estrutura em memória após carregar o JSON:
// jsonDados.meta, jsonDados.deltas, jsonDados.removidos
let jsonDados = null;

async function tentarCarregarEstadoAtual() {
    try {
        const url = BASE_URL + 'estado_atual.json';
        const resp = await fetch(url);
        if (!resp.ok) return false;
        const data = await resp.json();
        if (!data || !data.meta || !data.deltas) return false;

        jsonDados = data;

        // Atualiza metadados globais
        MES_MAIS_ATUAL       = data.meta.mes_mais_atual;
        anoMesAtivo          = MES_MAIS_ATUAL;
        filtroVisao          = { ano: MES_MAIS_ATUAL.slice(0,4), mes: MES_MAIS_ATUAL.slice(4,6), orgao: '' };
        filtroConsultaAnoMes = { ...filtroVisao };

        const el = document.getElementById('data-atualizacao-header');
        if (el && data.meta.gerado_em)
            el.textContent = ' ' + data.meta.gerado_em.slice(0,10).split('-').reverse().join('/');

        return true;
    } catch(e) {
        return false;
    }
}

// Constrói o estado dos servidores até um mês alvo,
// aplicando os deltas em sequência e respeitando remoções.
function construirEstadoDoJSON(anoMesAlvo) {
    if (!jsonDados) return new Map();

    const meses = jsonDados.meta.meses.filter(m => m <= anoMesAlvo);
    const estado = new Map();

    for (const mes of meses) {
        // Aplica alterações/novos do mês
        const delta = jsonDados.deltas[mes] || {};
        for (const [chave, reg] of Object.entries(delta)) {
            if (estado.has(chave)) {
                // Servidor existente: merge campo a campo
                const atual = estado.get(chave);
                for (const [k, v] of Object.entries(reg)) {
                    if (v !== '' && v !== null) atual[k] = v;
                }
            } else {
                // Servidor novo
                estado.set(chave, { ...reg });
            }
        }
        // Aplica remoções do mês (saíram do quadro)
        const removidos = jsonDados.removidos[mes] || [];
        for (const chave of removidos) {
            estado.delete(chave);
        }
    }
    return estado;
}

async function cargaInicial() {
    mostrarLoading(true, 'Carregando dados…');

    // Tenta o caminho rápido: JSON consolidado (1 requisição)
    const usouJSON = await tentarCarregarEstadoAtual();

    if (usouJSON) {
        todosServidores = construirEstadoDoJSON(MES_MAIS_ATUAL);
        anoMesAtivo = MES_MAIS_ATUAL;
        mostrarLoading(false);
        return;
    }

    // Fallback: lógica de deltas CSV (caso o JSON ainda não exista)
    await garantirMeses([MES_BASE, MES_MAIS_ATUAL]);
    todosServidores = construirEstado(MES_MAIS_ATUAL);
    anoMesAtivo = MES_MAIS_ATUAL;
    mostrarLoading(false);
    setTimeout(carregarDeltasBackground, 50);
}

async function construirBaseAte(anoMesAlvo) {
    // Se o JSON já está carregado, usa ele (instantâneo, sem requisições)
    if (jsonDados) {
        mostrarLoading(true, 'Aplicando dados…');
        todosServidores = construirEstadoDoJSON(anoMesAlvo);
        anoMesAtivo = anoMesAlvo;
        mostrarLoading(false);
        return;
    }

    // Fallback CSV
    const mesesNecessarios = getMesesDisponiveis().filter(am => am <= anoMesAlvo);
    const faltando = mesesNecessarios.filter(am => !cacheRows.has(am));
    if (faltando.length > 0) {
        mostrarLoading(true, 'Carregando dados…');
        await garantirMeses(faltando);
    }
    mostrarLoading(true, 'Aplicando dados…');
    todosServidores = construirEstado(anoMesAlvo);
    anoMesAtivo = anoMesAlvo;
    mostrarLoading(false);
}

// ============================================================
// LÓGICA DE MERGE DELTA
// ------------------------------------------------------------
// Os arquivos mensais (fev/22 em diante) contêm APENAS os
// registros que sofreram alguma alteração naquele mês — não
// são snapshots completos. Para obter o estado de um servidor
// em qualquer mês, é preciso:
//   1. Partir da base completa de jan/22
//   2. Aplicar cada delta mensal em ordem cronológica até o
//      mês alvo, sobrescrevendo campo a campo quem mudou
// ============================================================

// Aplica um delta CSV sobre o mapa atual.
// Cada linha tem situacao_delta: NOVO | ALTERADO | REMOVIDO
// Se o arquivo não tiver essa coluna (formato antigo), trata como NOVO/ALTERADO.
function aplicarDelta(mapaAtual, rowsDelta) {
    for (const row of (rowsDelta || [])) {
        const chave = `${(row.masp||'').trim()}|${(row.adm||'').trim()}`;
        if (!chave || chave === '|') continue;

        const situacao = (row.situacao_delta || '').toUpperCase();

        if (situacao === 'REMOVIDO') {
            mapaAtual.delete(chave);
            continue;
        }

        // NOVO, ALTERADO ou sem coluna (formato antigo)
        const base = mapaAtual.get(chave) || {};
        const merged = { ...base };
        for (const [campo, valor] of Object.entries(row)) {
            if (campo === 'situacao_delta') continue;
            const v = (valor ?? '').toString().trim();
            if (v !== '' && v.toLowerCase() !== 'nan') merged[campo] = valor;
        }
        mapaAtual.set(chave, merged);
    }
}

// Constrói o estado dos servidores aplicando todos os deltas
// em cache desde jan/22 até anoMesAlvo (inclusive).
function construirEstado(anoMesAlvo) {
    const meses = getMesesDisponiveis(); // ordem cronológica
    const resultado = new Map();

    // 1. Base: jan/2022 (snapshot completo)
    for (const row of (cacheRows.get(MES_BASE) || []))
        resultado.set(`${row.masp}|${row.adm}`, { ...row });

    // 2. Deltas mensais em ordem, até o mês alvo
    for (const am of meses) {
        if (am === MES_BASE) continue;
        if (am > anoMesAlvo) break;                 // passou do alvo, para
        if (!cacheRows.has(am)) continue;           // não baixado ainda, pula
        aplicarDelta(resultado, cacheRows.get(am));
    }
    return resultado;
}

async function construirBaseAte(anoMesAlvo) {
    const mesesNecessarios = getMesesDisponiveis().filter(am => am <= anoMesAlvo);
    const faltando = mesesNecessarios.filter(am => !cacheRows.has(am));
    if (faltando.length > 0) {
        mostrarLoading(true, 'Carregando dados…');
        await garantirMeses(faltando);
    }
    mostrarLoading(true, 'Aplicando dados…');
    todosServidores = construirEstado(anoMesAlvo);
    anoMesAtivo = anoMesAlvo;
    mostrarLoading(false);
}

// Indicador de progresso do carregamento em background
let backgroundProgress = 0;
let backgroundTotal = 0;
let backgroundConcluido = false;

function atualizarIndicadorBackground() {
    const el = document.getElementById('bg-progress-indicator');
    if (!el) return;
    if (backgroundConcluido) { el.style.display = 'none'; return; }
    if (backgroundTotal > 0) {
        const pct = Math.round((backgroundProgress / backgroundTotal) * 100);
        el.style.display = 'flex';
        el.querySelector('#bg-progress-txt').textContent = `Atualizando dados… ${pct}%`;
        el.querySelector('#bg-progress-bar-inner').style.width = pct + '%';
    }
}

async function cargaInicial() {
    // FASE 1: jan/22 + mês mais atual em paralelo → exibe imediatamente
    mostrarLoading(true, 'Carregando dados…');
    await garantirMeses([MES_BASE, MES_MAIS_ATUAL]);
    todosServidores = construirEstado(MES_MAIS_ATUAL);
    anoMesAtivo = MES_MAIS_ATUAL;
    mostrarLoading(false);

    // FASE 2: todos os deltas intermediários em background, todos em paralelo
    setTimeout(carregarDeltasBackground, 50);
}

async function carregarDeltasBackground() {
    const meses = getMesesDisponiveis().filter(am => am !== MES_BASE && am < MES_MAIS_ATUAL);
    const faltando = meses.filter(am => !cacheRows.has(am));
    if (faltando.length === 0) { backgroundConcluido = true; atualizarIndicadorBackground(); return; }

    backgroundProgress = 0;
    backgroundTotal = faltando.length;
    backgroundConcluido = false;
    atualizarIndicadorBackground();

    // Dispara TODAS as requisições em paralelo de uma vez
    const promises = faltando.map(am =>
        garantirMes(am).then(() => {
            backgroundProgress++;
            atualizarIndicadorBackground();
        })
    );
    await Promise.all(promises);

    // Reconstrói com todos os deltas aplicados
    backgroundConcluido = true;
    atualizarIndicadorBackground();
    todosServidores = construirEstado(anoMesAtivo);
    renderVisaoGeral();
    if (document.getElementById('consulta').classList.contains('show active')) renderConsulta();
}

// Exportar Visão CSV
function exportarVisaoCSV() {
    const dados = Array.from(todosServidores.values());
    const csv = Papa.unparse(dados, {delimiter:';'});
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `servidores_${filtroVisao.ano}${filtroVisao.mes}.csv`; a.click();
}

// Exportar Visão PDF
function exportarVisaoPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });
    doc.setFontSize(11);
    doc.text(`Relação Nominal de Servidores — ${nomeMes(filtroVisao.mes)}/${filtroVisao.ano}`, 14, 10);

    const dados = Array.from(todosServidores.values());
    const orgaos = {};
    for (const s of dados) {
        const orgao = s.desc_instituicao_dotacao || s.sigla_instituicao_dotacao || 'NÃO INFORMADO';
        if (!orgaos[orgao]) orgaos[orgao] = { total: 0, efetivos: 0, aposentados: 0, outros: 0 };
        orgaos[orgao].total++;
        const sit = (s.descsitserv||'').toUpperCase();
        if (sit.includes('EFETIVO')) orgaos[orgao].efetivos++;
        else if (sit.includes('APOSENTADO')) orgaos[orgao].aposentados++;
        else orgaos[orgao].outros++;
    }
    const rows = Object.entries(orgaos).map(([nome,info]) => [nome, info.total, info.efetivos, info.aposentados, info.outros]);
    doc.autoTable({
        startY: 16,
        head: [['Órgão','Total','Efetivos','Aposentados','Outros']],
        body: rows,
        foot: [['TOTAL GERAL', rows.reduce((a,r)=>a+r[1],0), rows.reduce((a,r)=>a+r[2],0), rows.reduce((a,r)=>a+r[3],0), rows.reduce((a,r)=>a+r[4],0)]],
        headStyles: { fillColor: [32,68,93] },
        footStyles: { fillColor: [223,227,232], textColor: [0,0,0], fontStyle: 'bold' },
        didDrawPage: () => {
            doc.setFontSize(9);
            doc.text(`Emitido em: ${new Date().toLocaleString('pt-BR')}`, 14, doc.internal.pageSize.height - 5);
        }
    });
    doc.save(`visao_geral_${filtroVisao.ano}${filtroVisao.mes}.pdf`);
}

function renderConsulta() {
    const dados = Array.from(todosServidores.values());

    let filtrado = dados.filter(s => {
        if (filtroConsulta.masp       && !(s.masp||'').toLowerCase().includes(filtroConsulta.masp.toLowerCase())) return false;
        if (filtroConsulta.nome       && !(s.nome||'').toLowerCase().includes(filtroConsulta.nome.toLowerCase())) return false;
        if (filtroConsulta.nmefetivo  && !(s.nmefetivo||'').toLowerCase().includes(filtroConsulta.nmefetivo.toLowerCase())) return false;
        if (filtroConsulta.instDotacao && 
            !(s.desc_instituicao_dotacao||'').toLowerCase().includes(filtroConsulta.instDotacao.toLowerCase()) &&
            !(s.sigla_instituicao_dotacao||'').toLowerCase().includes(filtroConsulta.instDotacao.toLowerCase()) &&
            !(s.desc_instituicao_lotacao||'').toLowerCase().includes(filtroConsulta.instDotacao.toLowerCase()) &&
            !(s.sigla_instituicao_lotacao||'').toLowerCase().includes(filtroConsulta.instDotacao.toLowerCase())) return false;
        if (filtroConsulta.instLotacao && !(s.desc_instituicao_lotacao||'').toLowerCase().includes(filtroConsulta.instLotacao.toLowerCase()) &&
            !(s.sigla_instituicao_lotacao||'').toLowerCase().includes(filtroConsulta.instLotacao.toLowerCase())) return false;
        if (filtroConsulta.situacao   && !(s.descsitserv||'').toLowerCase().includes(filtroConsulta.situacao.toLowerCase())) return false;
        if (buscaConsulta) {
            const busca = buscaConsulta.toLowerCase();
            const campos = [s.masp,s.nome,s.nmefetivo,s.desccomi,s.desc_funcao_gratif_gte,s.descsitserv,s.sigla_instituicao_dotacao,s.sigla_instituicao_lotacao];
            if (!campos.some(c=>(c||'').toLowerCase().includes(busca))) return false;
        }
        return true;
    });

    filtrado.sort((a,b) => {
        let va = a[ordenacaoConsulta.col]||''; let vb = b[ordenacaoConsulta.col]||'';
        if (typeof va==='string') va=va.toLowerCase();
        if (typeof vb==='string') vb=vb.toLowerCase();
        return ordenacaoConsulta.dir==='asc'?(va>vb?1:-1):(va<vb?1:-1);
    });

    servidoresFiltrados = filtrado;
    const total = filtrado.length;
    const totalPags = Math.ceil(total / itensPorPaginaConsulta);

function diffCampos(anterior, atual) {
    const campos = ['siglaefetivo','nmefetivo','cdcomi','desccomi','cd_funcao_gratif_gte','desc_funcao_gratif_gte',
        'carga_horaria','cd_instituicao_dotacao','sigla_instituicao_dotacao','desc_instituicao_dotacao',
        'cd_instituicao_lotacao','sigla_instituicao_lotacao','desc_instituicao_lotacao','descsitserv'];
    return campos.filter(c => (anterior[c]||'') !== (atual[c]||''));
}

const cacheDeltaHistorico = new Map();

async function garantirDeltaHistorico(anoMes) {
    if (cacheDeltaHistorico.has(anoMes)) return;
    if (anoMes === MES_BASE) { cacheDeltaHistorico.set(anoMes, null); return; }
    if (cacheRows.has(anoMes)) {
        const idx = new Map();
        for (const r of cacheRows.get(anoMes)) idx.set(`${r.masp}|${r.adm}`, r);
        cacheDeltaHistorico.set(anoMes, idx);
        return;
    }
    const url = BASE_URL + `dados_serv_${anoMes}.csv`;
    try {
        const resp = await fetch(url);
        if (!resp.ok) { cacheDeltaHistorico.set(anoMes, new Map()); return; }
        const text = await resp.text();
        await new Promise(resolve => {
            Papa.parse(text, { header:true, delimiter:';', skipEmptyLines:true, complete: r => {
                const idx = new Map();
                for (const row of r.data) idx.set(`${row.masp}|${row.adm}`, row);
                cacheDeltaHistorico.set(anoMes, idx);
                if (!cacheRows.has(anoMes)) cacheRows.set(anoMes, r.data);
                resolve();
            }});
        });
    } catch(e) { cacheDeltaHistorico.set(anoMes, new Map()); }
}

function expandirHistorico(masp, adm) {
    const chave = `${masp}|${adm}`;
    const meses = getMesesDisponiveis();
    const resultado = [];
    let ultimoReg = null;
    const baseRows = cacheRows.get(MES_BASE) || [];
    const regBase = baseRows.find(r => String(r.masp)===String(masp) && String(r.adm)===String(adm));
    if (regBase) { ultimoReg = regBase; resultado.push({...regBase, _am: MES_BASE, _alterou: false}); }
    for (const am of meses) {
        if (am === MES_BASE) continue;
        if (!cacheDeltaHistorico.has(am)) continue;
        const delta = cacheDeltaHistorico.get(am);
        const reg = delta ? delta.get(chave) : null;
        if (reg) { ultimoReg = reg; resultado.push({...reg, _am: am, _alterou: true}); }
        else if (ultimoReg) { resultado.push({...ultimoReg, _am: am, _alterou: false}); }
    }
    return resultado;
}

async function carregarTodosMesesHistorico(masp, adm, onProgress) {
    const meses = getMesesDisponiveis().filter(am => am !== MES_BASE);
    const faltando = meses.filter(am => !cacheDeltaHistorico.has(am));
    if (faltando.length === 0) { onProgress(100); return; }
    const LOTE = 5;
    let feitos = 0;
    for (let i = 0; i < faltando.length; i += LOTE) {
        const lote = faltando.slice(i, i+LOTE);
        await Promise.all(lote.map(am => garantirDeltaHistorico(am)));
        feitos += lote.length;
        onProgress(Math.round((feitos / faltando.length) * 100));
    }
}

function renderHistoricoTabela(masp, adm) {
    const historico = expandirHistorico(masp, adm);
    if (historico.length === 0) {
        return '<p class="text-muted text-center py-3" style="font-size:13px">Servidor não encontrado em Jan/2022. Histórico indisponível.</p>';
    }
    const linhas = [...historico].reverse().map((reg, i, arr) => {
        const isAtual  = i === 0;
        const anterior = arr[i+1];
        const mudou    = (reg._alterou && anterior) ? diffCampos(anterior, reg) : [];
        const temMudanca = mudou.length > 0;
        const tooltipMudancas = mudou.map(c => `${c}: ${anterior[c]||'-'} → ${reg[c]||'-'}`).join(' | ');
        const estilo = [
            isAtual    ? 'background:#eaf4fb;font-weight:600;' : '',
            temMudanca ? 'border-left:4px solid #f28c28;' : 'border-left:4px solid transparent;'
        ].join('');
        return `<tr style="${estilo}">
            <td class="text-center" style="white-space:nowrap">
                ${isAtual?'<span class="badge-sit badge-efetivo" style="margin-right:4px">Atual</span>':''}
                <span style="font-size:11px;color:#444">${nomeMes(reg._am.slice(4,6))}/${reg._am.slice(0,4)}</span>
                ${temMudanca?`<i class="material-icons" title="${tooltipMudancas}" style="font-size:13px;color:#f28c28;vertical-align:middle;cursor:help">edit_note</i>`:''}
            </td>
            <td style="font-size:11px">${reg.desccomi||'<span class="text-muted">—</span>'}</td>
            <td style="font-size:11px">${reg.desc_funcao_gratif_gte||'<span class="text-muted">—</span>'}</td>
            <td class="text-center" style="font-size:11px">${reg.carga_horaria||'-'}h</td>
            <td style="font-size:11px">${reg.sigla_instituicao_dotacao||'-'}</td>
            <td style="font-size:11px">${reg.sigla_instituicao_lotacao||'-'}</td>
            <td class="text-center">${badgeSit(reg.descsitserv)}</td>
        </tr>`;
    }).join('');
    const totalCarregados = [...getMesesDisponiveis()].filter(am => cacheDeltaHistorico.has(am)||am===MES_BASE).length;
    const totalMeses = getMesesDisponiveis().length;
    return `
        <div class="hist-legend">
            <span><i class="material-icons" style="font-size:11px;vertical-align:middle">history</i>
                <strong>${historico.length}</strong> competências &nbsp;|&nbsp; ${totalCarregados}/${totalMeses} meses no cache
            </span>
            <span style="color:#f28c28">
                <i class="material-icons" style="font-size:11px;vertical-align:middle">edit_note</i>
                Laranja = alteração naquele mês
            </span>
        </div>
        <div class="table-fixed-header-container" style="max-height:400px;">
            <table class="table" style="font-size:11px">
                <thead>
                    <tr>
                        <th>Competência</th>
                        <th>Cargo Comissão</th>
                        <th>Função Gratificada</th>
                        <th>C.H.</th>
                        <th>Inst. Dotação</th>
                        <th>Inst. Lotação</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody>${linhas}</tbody>
            </table>
        </div>`;
}

          <div class="spinner-border spinner-border-sm me-2" role="status" style="color:#20445d;"></div>

          <div class="progress mt-2 mx-auto" style="max-width:280px;height:5px">
            <div id="hist-progress-bar" class="progress-bar" style="width:0%;background:#20445d"></div>
          </div>
        </div>
        <div id="hist-tabela" style="display:none"></div>
      </div>`;

    document.getElementById('modalContent').innerHTML = html;
    const modal = new bootstrap.Modal(document.getElementById('detailModal'));
    modal.show();

    const masp = s.masp; const adm = s.adm;
    carregarTodosMesesHistorico(masp, adm, (pct) => {
        const bar = document.getElementById('hist-progress-bar');
        const txt = document.getElementById('hist-loading-txt');
        if (bar) bar.style.width = pct + '%';
        if (txt) txt.textContent = pct < 100 ? `Carregando meses… ${pct}%` : 'Montando histórico…';
        if (pct === 100) {
            setTimeout(() => {
                const loading = document.getElementById('hist-loading');
                const tabela  = document.getElementById('hist-tabela');
                if (loading) loading.style.display = 'none';
                if (tabela) {
                    tabela.style.display = '';
                    tabela.innerHTML = renderHistoricoTabela(masp, adm);
                    _modalHistoricoData = expandirHistorico(masp, adm);
                }
            }, 100);
        }
    });
}

function exportarModalPDF() {

function exportarModalCSV() {
    if (!_modalServidor) return;
    const s = _modalServidor;
    if (_modalHistoricoData && _modalHistoricoData.length > 0) {
        const cab = ['competencia','cargo_comissao','funcao_gratificada','carga_horaria','inst_dotacao','inst_lotacao','situacao'];
        const linhas = _modalHistoricoData.map(h => [
            `${nomeMes(h._am.slice(4,6))}/${h._am.slice(0,4)}`,
            h.desccomi||'', h.desc_funcao_gratif_gte||'', h.carga_horaria||'',
            h.sigla_instituicao_dotacao||'', h.sigla_instituicao_lotacao||'', h.descsitserv||''
        ].map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';'));
        const csv = [cab.join(';'), ...linhas].join('\n');
        const blob = new Blob(['\uFEFF'+csv], {type:'text/csv'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `ficha_${v(s.masp)}.csv`; a.click();
    } else {
        const csv = Papa.unparse([s], {delimiter:';'});
        const blob = new Blob(['\uFEFF'+csv], {type:'text/csv'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `ficha_${v(s.masp)}.csv`; a.click();
    }
}

document.addEventListener('click', e => {

        document.querySelectorAll('.column-selector-popup').forEach(p => p.classList.remove('show'));

document.addEventListener('DOMContentLoaded', async () => {
    // Detecta o mês mais atual ANTES de carregar os dados
    await setupAtualizacaoData();

    // Carga inicial rápida (jan/22 + mês atual) + background para intermediários
    await cargaInicial();

    renderDownloads();

    // Dicionário renderiza ao clicar na aba (lazy)
    document.querySelector('[data-bs-target="#dicionario"]').addEventListener('shown.bs.tab', () => {
        renderDicionario();
    });

    // Consulta renderiza ao clicar na aba (lazy)
    document.querySelector('[data-bs-target="#consulta"]').addEventListener('shown.bs.tab', () => {
        filtroConsultaAnoMes = { ano: filtroVisao.ano, mes: filtroVisao.mes };
        renderConsulta();
    });

    // Ativa tooltips
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
});

// ============================================================
// 11. IFRAME RESIZE OBSERVER
// ============================================================
(function () {
    function sendHeight() {
        const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) + 10;
        try { window.parent.postMessage({ iframeHeight: h, iframeResize: true, type: 'resize' }, '*'); } catch(e) {}
    }
    if (window.ResizeObserver) new ResizeObserver(sendHeight).observe(document.body);
    else { window.addEventListener('resize', sendHeight); setInterval(sendHeight, 2000); }
    sendHeight();
})();
